services:
  kbo-api:
    build: ./mock_api
    container_name: kbo-api
    ports:
      - "8000:8000"
    restart: always

  kbo-db:
    image: postgres:15-alpine
    container_name: kbo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tera}
      POSTGRES_DB: ${POSTGRES_DB:-baseball}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: always

  metabase:
    image: metabase/metabase:latest
    container_name: kbo-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: always

  dashboard:
    image: python:3.11-slim
    container_name: kbo-dashboard
    working_dir: /app
    command: python -m http.server 8501 --directory dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: always

volumes:
  metabase_data:
