version: '3.8'

services:
  # (기존) API 서버
  kbo-api:
    build: ./mock_api
    container_name: kbo-api
    ports:
      - "8000:8000"
    restart: always

  # (기존) DB 서버
  kbo-db:
    image: postgres:15-alpine
    container_name: kbo-db
    environment:
      POSTGRES_USER: tera
      POSTGRES_PASSWORD: tera
      POSTGRES_DB: baseball
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: always

  # [NEW] 여기에 추가하세요!
  metabase:
    image: metabase/metabase:latest
    container_name: kbo-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db # 메타베이스 설정 저장 파일
    volumes:
      - ./metabase_data:/metabase-data       # 설정 안 날아가게 저장
    depends_on:
      - kbo-db
    restart: always
